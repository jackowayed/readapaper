name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Ensure npm >= 11.10 (min-release-age support)
        # Bundled npm on Node 20/22 is 10.x, which silently ignores the
        # `min-release-age=7` gate in `.npmrc`. Env-var bypass (not a CLI
        # flag) so npm 10 doesn't choke on the unknown option.
        run: npm_config_min_release_age=0 npm install -g npm@^11
      - name: Install dependencies
        run: npm ci || (sleep 30 && npm ci)
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit
        # Baseline (2026-09-11) has 1 high (postcss via next, fix needs a
        # breaking Next major) so `high` fails; gate on `critical` until the
        # Next upgrade lands. See QUALITY_PLAN.md P2 follow-ups.
        run: npm audit --audit-level=critical

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Ensure npm >= 11.10 (min-release-age support)
        # See build-test job: bundled npm 10.x silently ignores the gate.
        run: npm_config_min_release_age=0 npm install -g npm@^11
      - name: Install dependencies
        run: npm ci || (sleep 30 && npm ci)
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run e2e tests
        run: npm run test:e2e
